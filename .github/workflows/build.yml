name: Build IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: SQLink
        run: |
          rm -rf SQLink.xcodeproj
          xcodegen generate

      - name: Select Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Build unsigned .app
        working-directory: SQLink
        run: |
          xcodebuild -project SQLink.xcodeproj \
            -scheme SQLink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        working-directory: SQLink
        run: |
          APP=$(find build -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r SQLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SQLink-ipa
          path: SQLink/SQLink.ipa

      - name: Delete all existing releases and tags (keep only the latest one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting all existing releases..."
          for rel in $(curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(str(r['id']) for r in d))" 2>/dev/null); do
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/$rel"
            echo "deleted release $rel"
          done
          echo "Deleting all tags..."
          for t in $(curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/git/refs/tags?per_page=100" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(ref['ref'].replace('refs/tags/','') for ref in d))" 2>/dev/null); do
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$t" || true
            echo "deleted tag $t"
          done
          echo "cleanup done"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: SQLink v1.0.10
          files: SQLink/SQLink.ipa
          fail_on_unmatched_files: false
          body: |
            # SQLink —— iOS 上的 MySQL 客户端

            SQLink 是一款 iOS 原生 MySQL 客户端，直接连接你的数据库，无需自建服务器中转，手机上即可查看与管理数据。

            ## 功能特性

            - **远程连接**：填写主机、端口、账号、密码、数据库即可直连 MySQL
            - **库表浏览**：树状导航浏览所有数据库与数据表
            - **表结构**：查看字段名、类型、主键、默认值、注释，并支持查看建表 SQL
            - **数据浏览**：分页查看表数据，支持按条件筛选与排序，支持双指缩放表格；真实主键列以 🔑 标记高亮
            - **数据编辑**：对数据行进行修改、删除（需表含主键/唯一键，会员功能）
            - **数据导出**：支持导出 CSV、SQL；会员支持全量流式导出，免费版每次限 100 行
            - **SQL 控制台**：编写并执行任意 SQL，自动保存查询历史与上次 SQL（按数据表分别记忆）
            - **连接管理**：通过 iCloud 钥匙串在设备间同步连接配置（换机/重装自动恢复）
            - **意见反馈**：可在 App 内提交反馈
            - **外观**：支持浅色 / 深色主题，头像可上传

            ## 使用说明

            1. **安装**：通过 TrollStore 安装本 IPA（需 iOS 15 及以上，无需越狱、无需 Apple 开发者账号）
            2. **添加连接**：在连接页填写数据库连接信息后保存
            3. **浏览数据**：选择数据库 → 选择数据表 → 点击「查看数据」即可浏览（真实主键列以 🔑 高亮）
            4. **查询**：使用顶部「查询控制台」编写并执行 SQL
            5. **编辑 / 导出**：在「查看数据」中使用「编辑」修改数据或「导出」导出结果（会员功能）
            6. **账号与会员**：登录账号可使用会员功能、云端同步与意见反馈；输入激活码开通会员。已登录用户开通会员后，进入「我的」点击「刷新会员状态」即可生效，无需退出重登

            ## 会员说明

            - **免费版**：连接管理、表结构、分页浏览（查看上限 100 条）、筛选排序、SQL 控制台、SQL 自动保存、浅色/深色主题；数据编辑与全量导出为会员权益，导出限 100 行/次
            - **会员版**：无限查看全部数据、数据内联编辑、全量流式导出
            - 会员权益可由后端实时配置，无需发版

            ---

            如有问题或建议，可通过 App 内「意见反馈」联系作者。

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
