name: Build IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          rm -rf SQLink.xcodeproj
          xcodegen generate

      - name: Select Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Build unsigned .app
        run: |
          xcodebuild -project SQLink.xcodeproj \
            -scheme SQLink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r SQLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SQLink-ipa
          path: SQLink.ipa

      - name: Delete existing release (overwrite single version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v1.0.8
          REL=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          REL_ID=$(echo "$REL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])" 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID"
            echo "deleted existing release $REL_ID"
          fi
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG" || true
          echo "tag cleanup done"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: SQLink v1.0.8
          files: SQLink.ipa
          fail_on_unmatched_files: false
          body: |
            ## SQLink v1.0.8（集成测试版，不含 IAP）

            ### 本次更新
            - 整合此前累积改动并统一发布：意见反馈（iOS 端提交 + 后端双重限流）、iCloud 钥匙串抗卸载（换机/重装免登录自动恢复会员）、移除手动刷新按钮改静默同步
            - 全接口防爆破加固：登录账号级失败锁定（5 次错误锁 15 分钟）、激活码兑换账号级限流（10 分钟内最多 10 次，超出锁 10 分钟）、管理员密钥 1 分钟错 3 次锁 30 分钟、反馈字数 10~500
            - 合规清理：移除 App 内微信收款码 / 价格引导（为后续上架做准备）

            ## SQLink v1.0.7

            ### 本次更新
            - 全接口防爆破加固：登录新增账号级失败锁定（同账号 5 次密码错误锁定 15 分钟）；激活码兑换新增账号级限流（10 分钟内最多 10 次尝试，超出锁定 10 分钟，防批量猜测）
            - 意见反馈字数调整：最少 10 字、最多 500 字（客户端计数器同步）

            ## SQLink v1.0.6

            ### 本次更新
            - 新增「意见反馈」入口（「我的」→「反馈与帮助」）：可提交文字反馈与选填联系方式；后端按账号 + IP 双重限流防爆破（账号 5 次/小时、IP 20 次/小时）
            - 会员状态与登录态自动同步到 iCloud 钥匙串：换手机 / 卸载重装（同一 Apple ID）后自动恢复会员，无需重新登录（需开启 iCloud 钥匙串）
            - 移除「我的」页「刷新会员状态」手动按钮，改为冷启动 / 登录态变化时静默同步（本地优先，断网或服务器到期不影响已付费会员使用）

            ### 账号与会员
            - 邮箱账号体系：注册、登录、找回密码，会员状态由后端决定
            - 会员开通：未登录或未会员用户可在「我的」页输入激活码开通会员（激活码由后端下发）
            - 游客模式：不登录可进入 App 使用基础数据库功能，导出等 PRO 功能需登录并开通会员

            ### 免费版 / 会员版 权益（可后端实时配置，无需发版）
            - 免费版：连接管理、表结构、分页浏览（查看上限 100 条）、筛选排序、SQL 控制台、SQL 自动保存、浅色/深色主题；**数据编辑**与**全量导出**为会员权益，导出限 100 行/次
            - 会员版：无限查看全部数据、数据内联编辑（需 Pro 会员且带筛选/WHERE 条件）、全量导出（流式，不卡死）
            - 头像：支持上传头像到七牛云（我的页 → 更换头像，存于 sqlink/avatars/）

            ### 导出优化
            - 流式导出：分块拉取 + 增量写文件 + 后台线程，大表导出不再卡死/内存溢出，带实时进度
            - 导出 = 查询出来的全部匹配结果（含筛选条件），不再只导前 100 条

            ### 其他
            - 分页浏览：上一页/下一页、页码与总页数；每页条数 50/100/200/500 快捷切换
            - SQL 自动保存：按数据表分别记忆，重进控制台自动恢复（可关闭）
            - 「我的」页面：主题切换、查询设置、会员与分享、App 下载链接一键分享到微信/QQ
            - 沿用此前：查询历史、复制单元格、筛选排序 AND/OR、连接管理等
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
